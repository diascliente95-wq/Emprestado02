<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e3c72">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Emprestimos 30%</title>

<!-- Bibliotecas Estáveis -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<style>
    :root { --primary: #1e3c72; --secondary: #2a5298; --accent: #4ade80; --danger: #ef4444; --text: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: linear-gradient(135deg, var(--primary), var(--secondary)); min-height: 100vh; color: var(--text); padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom); overscroll-behavior: none; }
    
    /* Componentes */
    .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
    h1 { text-align: center; font-size: 1.4rem; margin-bottom: 15px; padding-top: 10px; }
    h3 { font-size: 1rem; margin-bottom: 12px; opacity: 0.9; }
    
    /* Inputs e Labels */
    label { display: block; font-size: 0.8rem; margin-bottom: 4px; opacity: 0.8; }
    input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white; font-size: 16px; margin-bottom: 10px; }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    
    /* Botões */
    button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: transform 0.1s; margin-top: 5px; color: white; }
    button:active { transform: scale(0.98); }
    .btn-green { background: var(--accent); color: #000; }
    .btn-blue { background: #3b82f6; }
    .btn-red { background: var(--danger); }
    .btn-whats { background: #25d366; }
    .btn-row { display: flex; gap: 10px; margin-top: 10px; }
    .btn-row button { flex: 1; margin-top: 0; }
    
    /* Stats Grid */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .stat-box { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px; text-align: center; }
    .stat-val { font-size: 1.1rem; font-weight: bold; color: var(--accent); }
    .stat-lbl { font-size: 0.7rem; opacity: 0.7; margin-top: 2px; }
    
    /* Tabela Responsiva */
    .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -20px; padding: 0 20px; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.85rem; }
    th { background: rgba(0,0,0,0.2); position: sticky; top: 0; }
    .status { padding: 4px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
    .st-pending { background: #fbbf24; color: black; }
    .st-paid { background: var(--accent); color: black; }
    .st-late { background: var(--danger); }
    
    /* Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-content { background: var(--primary); width: 100%; max-width: 400px; border-radius: 20px; padding: 25px; text-align: center; border: 1px solid rgba(255,255,255,0.2); max-height: 90vh; overflow-y: auto; }
    .qr-img { background: white; padding: 15px; border-radius: 10px; margin: 15px auto; display: block; max-width: 200px; }
    .pix-code { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; font-family: monospace; font-size: 0.7rem; word-break: break-all; margin: 10px 0; max-height: 80px; overflow-y: auto; text-align: left; }
    
    /* Toast */
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); padding: 12px 24px; border-radius: 25px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 2000; white-space: nowrap; }
    .toast.show { opacity: 1; }
    
    /* Tabs Config */
    .tabs { display: flex; gap: 5px; margin-bottom: 15px; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 10px; }
    .tab-btn { flex: 1; padding: 10px; border-radius: 8px; background: transparent; margin: 0; font-size: 0.9rem; opacity: 0.7; }
    .tab-btn.active { background: rgba(255,255,255,0.1); opacity: 1; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
</style>
</head>
<body>

<div class="container">
    <h1>💰 Painel de Empréstimo</h1>
    
    <!-- Status DB -->
    <div style="text-align:center; margin-bottom:10px;">
        <span id="dbStatus" style="font-size:0.8rem; padding:4px 12px; border-radius:20px; background:rgba(0,0,0,0.3);">🟡 Modo Offline</span>
    </div>

    <!-- Configurações -->
    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('pix')">💳 Pix</button>
            <button class="tab-btn" onclick="switchTab('db')">☁️ Nuvem</button>
        </div>

        <div id="tab-pix" class="tab-content active">
            <label>Nome Beneficiário</label>
            <input type="text" id="cfgNome" placeholder="SEU NOME COMPLETO">
            <label>Cidade</label>
            <input type="text" id="cfgCidade" placeholder="SAO PAULO" maxlength="15">
            <label>Chave Pix</label>
            <input type="text" id="cfgChave" placeholder="CPF, Email ou Aleatória">
            <button class="btn-blue" onclick="saveConfig()">Salvar Dados Pix</button>
        </div>

        <div id="tab-db" class="tab-content">
            <p style="font-size:0.8rem; opacity:0.8; margin-bottom:10px;">Configure para acessar de vários dispositivos.</p>
            <label>Firebase API Key</label>
            <input type="text" id="fbKey">
            <label>Auth Domain</label>
            <input type="text" id="fbDomain">
            <label>Project ID</label>
            <input type="text" id="fbProject">
            <button class="btn-blue" onclick="initFirebase()">Conectar Firebase</button>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="stats">
        <div class="stat-box"><div class="stat-val" id="sTotal">R$ 0</div><div class="stat-lbl">Emprestado</div></div>
        <div class="stat-box"><div class="stat-val" id="sPending">R$ 0</div><div class="stat-lbl">A Receber</div></div>
        <div class="stat-box"><div class="stat-val" id="sReceived">R$ 0</div><div class="stat-lbl">Recebido</div></div>
        <div class="stat-box"><div class="stat-val" id="sCount">0</div><div class="stat-lbl">Ativos</div></div>
    </div>

    <!-- Novo Empréstimo -->
    <div class="card">
        <h3>📝 Novo Registro</h3>
        <label>Nome Cliente</label>
        <input type="text" id="inNome">
        <label>WhatsApp (apenas números)</label>
        <input type="tel" id="inTel" placeholder="11999998888">
        <label>Valor Emprestado (R$)</label>
        <input type="number" id="inValor" step="0.01" oninput="calcPreview()">
        
        <div style="display:flex; gap:10px;">
            <div style="flex:1"><label>Data Saída</label><input type="datetime-local" id="inData"></div>
            <div style="flex:1"><label>Vencimento</label><input type="datetime-local" id="inVenc"></div>
        </div>

        <div id="preview" style="background:rgba(0,0,0,0.2); padding:10px; border-radius:8px; margin:10px 0; font-size:0.85rem; display:none;">
            Juros (30%): <span id="prevJuros" style="color:#fbbf24">R$ 0,00</span> | 
            Total: <span id="prevTotal" style="color:var(--accent); font-weight:bold;">R$ 0,00</span>
        </div>

        <div class="btn-row">
            <button class="btn-green" onclick="addLoan()">➕ Registrar</button>
            <button class="btn-red" onclick="generatePDF()">📄 PDF</button>
        </div>
    </div>

    <!-- Lista -->
    <div class="card">
        <h3>📋 Registros</h3>
        <div class="table-container">
            <table>
                <thead><tr><th>Cliente</th><th>Valor</th><th>Total</th><th>Venc.</th><th>Status</th><th>Ação</th></tr></thead>
                <tbody id="tbBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Pix -->
<div class="modal" id="pixModal">
    <div class="modal-content">
        <h3>Pagamento Pix</h3>
        <p id="mCliente" style="margin:5px 0; opacity:0.8;"></p>
        <h2 id="mValor" style="color:var(--accent); margin-bottom:10px;"></h2>
        
        <img id="qrImg" class="qr-img" alt="QR Code Pix">
        <div class="pix-code" id="pixCodeText"></div>
        
        <div class="btn-row">
            <button class="btn-blue" onclick="copyPix()">📋 Copiar</button>
            <button class="btn-whats" onclick="sendWhats()">📱 Zap</button>
        </div>
        <button class="btn-red" onclick="closeModal()" style="margin-top:15px;">Fechar</button>
    </div>
</div>

<div class="toast" id="toast">Mensagem</div>

<script>
/** ESTADO GLOBAL **/
let loans = JSON.parse(localStorage.getItem('loans_v2') || '[]');
let config = JSON.parse(localStorage.getItem('pix_cfg') || '{}');
let db = null;
let isOnline = false;
let currentLoan = null;

/** INICIALIZAÇÃO **/
window.onload = () => {
    // Carregar configs
    if(config.nome) document.getElementById('cfgNome').value = config.nome;
    if(config.cidade) document.getElementById('cfgCidade').value = config.cidade;
    if(config.chave) document.getElementById('cfgChave').value = config.chave;
    
    // Datas padrão
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('inData').value = now.toISOString().slice(0,16);
    
    const venc = new Date(now);
    venc.setDate(venc.getDate() + 30);
    document.getElementById('inVenc').value = venc.toISOString().slice(0,16);
    
    render();
};

/** UTILITÁRIOS **/
const fmt = v => 'R$ ' + Number(v).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const fmtDate = d => d ? new Date(d).toLocaleDateString('pt-BR') + ' ' + new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '-';
const toast = msg => { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); };
const switchTab = tab => {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    event.target.classList.add('active');
};

/** LÓGICA DE NEGÓCIO **/
function calcPreview() {
    const v = parseFloat(document.getElementById('inValor').value) || 0;
    const j = v * 0.30;
    document.getElementById('preview').style.display = v > 0 ? 'block' : 'none';
    document.getElementById('prevJuros').textContent = fmt(j);
    document.getElementById('prevTotal').textContent = fmt(v + j);
}

function saveConfig() {
    config = {
        nome: document.getElementById('cfgNome').value.toUpperCase(),
        cidade: document.getElementById('cfgCidade').value.toUpperCase(),
        chave: document.getElementById('cfgChave').value.trim()
    };
    localStorage.setItem('pix_cfg', JSON.stringify(config));
    toast('✅ Configuração salva!');
}

async function addLoan() {
    const nome = document.getElementById('inNome').value.trim();
    const tel = document.getElementById('inTel').value.replace(/\D/g,'');
    const val = parseFloat(document.getElementById('inValor').value);
    const data = document.getElementById('inData').value;
    const venc = document.getElementById('inVenc').value;

    if(!nome || !val || !data || !venc) return toast('⚠️ Preencha todos os campos!');

    const loan = { id: Date.now(), nome, tel, val, data, venc, status:'pendente', created: new Date().toISOString() };

    if(isOnline && db) {
        await db.collection('loans').add(loan);
    } else {
        loans.push(loan);
        localStorage.setItem('loans_v2', JSON.stringify(loans));
    }
    
    // Reset form
    document.getElementById('inNome').value = '';
    document.getElementById('inTel').value = '';
    document.getElementById('inValor').value = '';
    document.getElementById('preview').style.display = 'none';
    render();
    toast('✅ Registrado com sucesso!');
}

function getInterest(l) {
    const days = (new Date(l.venc) - new Date(l.data)) / (1000*60*60*24);
    return l.val * 0.30 * (days/30);
}

function getStatus(l) {
    if(l.status === 'pago') return 'pago';
    return new Date(l.venc) < new Date() ? 'atrasado' : 'pendente';
}

function render() {
    const tb = document.getElementById('tbBody');
    tb.innerHTML = '';
    let totEmp=0, totRec=0, totPend=0, ativos=0;

    loans.forEach(l => {
        const jur = getInterest(l);
        const total = l.val + jur;
        const st = getStatus(l);
        
        totEmp += l.val;
        if(st==='pago') totRec += total; else { totPend += total; ativos++; }

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${l.nome}</td>
            <td>${fmt(l.val)}</td>
            <td style="color:var(--accent)">${fmt(total)}</td>
            <td>${fmtDate(l.venc)}</td>
            <td><span class="status st-${st==='pago'?'paid':st==='atrasado'?'late':'pending'}">${st}</span></td>
            <td>
                <div style="display:flex;gap:5px;">
                    <button style="padding:8px;font-size:0.7rem;margin:0;" onclick="openPix('${l.id}')">Pix</button>
                    ${st!=='pago'?`<button style="padding:8px;font-size:0.7rem;margin:0;background:#3b82f6;" onclick="markPaid('${l.id}')">✓</button>`:''}
                    <button style="padding:8px;font-size:0.7rem;margin:0;background:#ef4444;" onclick="delLoan('${l.id}')">🗑</button>
                </div>
            </td>
        `;
        tb.appendChild(tr);
    });

    document.getElementById('sTotal').textContent = fmt(totEmp);
    document.getElementById('sPending').textContent = fmt(totPend);
    document.getElementById('sReceived').textContent = fmt(totRec);
    document.getElementById('sCount').textContent = ativos;
}

async function markPaid(id) {
    if(!confirm('Confirmar recebimento?')) return;
    if(isOnline && db) {
        await db.collection('loans').doc(id).update({status:'pago', paidAt:new Date().toISOString()});
    } else {
        const l = loans.find(x=>String(x.id)===String(id));
        if(l) { l.status='pago'; localStorage.setItem('loans_v2', JSON.stringify(loans)); }
    }
    render();
    toast('✅ Pago!');
}

async function delLoan(id) {
    if(!confirm('Excluir registro?')) return;
    if(isOnline && db) {
        await db.collection('loans').doc(id).delete();
    } else {
        loans = loans.filter(x=>String(x.id)!==String(id));
        localStorage.setItem('loans_v2', JSON.stringify(loans));
    }
    render();
}

/** PIX & QR CODE **/
function openPix(id) {
    if(!config.chave) return toast('⚠️ Configure sua chave Pix primeiro!');
    const l = loans.find(x=>String(x.id)===String(id));
    if(!l) return;
    
    currentLoan = l;
    const total = l.val + getInterest(l);
    const payload = buildPixPayload(total, l.id);
    
    document.getElementById('mCliente').textContent = l.nome;
    document.getElementById('mValor').textContent = fmt(total);
    document.getElementById('pixCodeText').textContent = payload;
    
    // Usa API pública confiável para gerar QR (evita erro de lib local)
    document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(payload)}`;
    
    document.getElementById('pixModal').classList.add('active');
}

function buildPixPayload(val, id) {
    const gui = 'br.gov.bcb.pix';
    const mai = tlv('00', gui) + tlv('01', config.chave);
    const ref = 'EMP' + String(id).slice(-8);
    const add = tlv('05', ref);
    
    let p = '';
    p += tlv('00', '01');
    p += tlv('26', mai);
    p += tlv('52', '0000');
    p += tlv('53', '986');
    if(val>0) p += tlv('54', val.toFixed(2));
    p += tlv('58', 'BR');
    p += tlv('59', config.nome.substring(0,25));
    p += tlv('60', config.cidade.substring(0,15));
    p += tlv('62', add);
    p += '6304';
    return p + crc16(p);
}

function tlv(tag, val) { return tag + String(val.length).padStart(2,'0') + val; }

function crc16(str) {
    let crc = 0xFFFF;
    for(let i=0; i<str.length; i++) {
        crc ^= str.charCodeAt(i) << 8;
        for(let j=0; j<8; j++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
    }
    return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4,'0');
}

function copyPix() {
    const code = document.getElementById('pixCodeText').textContent;
    navigator.clipboard.writeText(code).then(()=>toast('📋 Copiado!')).catch(()=>toast('❌ Erro ao copiar'));
}

function sendWhats() {
    if(!currentLoan || !currentLoan.tel) return toast('⚠️ Sem telefone cadastrado!');
    const total = currentLoan.val + getInterest(currentLoan);
    const code = document.getElementById('pixCodeText').textContent;
    
    const msg = `Olá ${currentLoan.nome}! 👋\n\nSeu empréstimo venceu/em breve.\n💰 Valor: ${fmt(total)}\n📅 Venc: ${fmtDate(currentLoan.venc)}\n\n📱 Pix Copia e Cola:\n${code}\n\nQualquer dúvida, estou à disposição!`;
    window.open(`https://wa.me/55${currentLoan.tel}?text=${encodeURIComponent(msg)}`, '_blank');
}

function closeModal() { document.getElementById('pixModal').classList.remove('active'); currentLoan=null; }

/** FIREBASE **/
async function initFirebase() {
    const key = document.getElementById('fbKey').value.trim();
    const dom = document.getElementById('fbDomain').value.trim();
    const proj = document.getElementById('fbProject').value.trim();
    
    if(!key || !dom || !proj) return toast('⚠️ Preencha todos os dados!');
    
    try {
        if(!firebase.apps.length) firebase.initializeApp({apiKey:key, authDomain:dom, projectId:proj});
        db = firebase.firestore();
        isOnline = true;
        
        // Sincronização em tempo real
        db.collection('loans').onSnapshot(snap => {
            loans = [];
            snap.forEach(doc => loans.push({id:doc.id, ...doc.data()}));
            render();
        });
        
        document.getElementById('dbStatus').innerHTML = '🟢 Online (Firebase)';
        document.getElementById('dbStatus').style.background = '#4ade80';
        document.getElementById('dbStatus').style.color = '#000';
        toast('☁️ Conectado à nuvem!');
    } catch(e) {
        console.error(e);
        toast('❌ Erro conexão Firebase');
    }
}

/** PDF **/
function generatePDF() {
    if(loans.length===0) return toast('⚠️ Sem dados!');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    doc.setFontSize(18); doc.setTextColor(30,60,114); doc.text("Relatório Empréstimos", 14, 20);
    doc.setFontSize(10); doc.setTextColor(100); doc.text(`Gerado: ${new Date().toLocaleString()}`, 14, 28);
    
    const rows = loans.map(l => [
        l.nome, fmt(l.val), fmt(l.val+getInterest(l)), fmtDate(l.venc), getStatus(l).toUpperCase()
    ]);
    
    doc.autoTable({ startY:35, head:[['Cliente','Valor','Total','Vencimento','Status']], body:rows, theme:'striped', headStyles:{fillColor:[30,60,114]} });
    doc.save(`relatorio_${Date.now()}.pdf`);
    toast('📄 PDF Baixado!');
}
</script>
</body>
</html>
