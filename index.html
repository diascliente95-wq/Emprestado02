<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Empréstimos 💰 30% a.m.</title>
    <style>
        :root {
            --primary: #25d366;
            --dark: #1e293b;
            --light: #f8fafc;
            --accent: #6366f1;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #06b6d4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: var(--light);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left {
            display: flex;
            flex-direction: column;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .relogio-digital {
            background: #020617;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #334155;
            font-family: monospace;
            font-size: 18px;
            color: #38bdf8;
            letter-spacing: 1px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }

        h1, h2, h3 { margin: 0; }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
        }

        .btn:hover { opacity: 0.9; }
        .btn-success { background: var(--primary); color: #000; }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-info { background: var(--info); color: #000; }

        .form-container {
            background: var(--dark);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 5px;
            font-size: 14px;
            color: #94a3b8;
        }

        .form-group input {
            background: #334155;
            border: 1px solid #475569;
            padding: 10px;
            border-radius: 4px;
            color: white;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--dark);
            border-left: 5px solid var(--accent);
            border-radius: 8px;
            padding: 20px;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .card.vencido { border-left-color: var(--danger); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .cronometro {
            background: #334155;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }

        .pix-box {
            background: #111827;
            padding: 12px;
            border-radius: 6px;
            margin: 15px 0;
            font-size: 13px;
            border: 1px dashed var(--primary);
        }

        .pix-destaque {
            color: var(--primary);
            font-weight: bold;
            font-size: 14px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }

        .action-row {
            display: flex;
            gap: 8px;
        }

        .actions button {
            flex: 1;
            font-size: 12px;
            padding: 10px;
        }

        .alert-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent);
            color: #fff;
            padding: 15px 25px;
            border-radius: 6px;
            font-weight: bold;
            display: none;
            z-index: 1000;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-left">
                <h1>Painel de Empréstimos 💸🏦</h1>
                <p style="color: #94a3b8; margin: 5px 0 0 0;">📈 Taxa fixa de 30% ao mês</p>
            </div>
            <div class="header-right">
                <div class="relogio-digital" id="relogio">00:00:00</div>
                <button class="btn" onclick="forçarAtualizacao()">🔄 Atualizar</button>
                <!-- Atalho direto para abrir a outra página -->
                <a href="historico.html" class="btn btn-info">📜 Ver Histórico (Nova Página)</a>
            </div>
        </header>

        <div class="form-container">
            <h3>➕ Cadastrar Novo Empréstimo</h3>
            <div class="grid-form">
                <div class="form-group">
                    <label>👤 Nome do Cliente</label>
                    <input type="text" id="nome" placeholder="Ex: João Silva">
                </div>
                <div class="form-group">
                    <label>💵 Valor Emprestado (R$)</label>
                    <input type="number" id="valor" placeholder="Ex: 1000">
                </div>
                <div class="form-group">
                    <label>📅 Data de Vencimento</label>
                    <input type="date" id="dataVencimento">
                </div>
                <div class="form-group">
                    <label>🕒 Horário do Vencimento</label>
                    <input type="time" id="horaVencimento" value="12:00">
                </div>
                <div class="form-group" style="justify-content: flex-end;">
                    <button class="btn btn-success" onclick="adicionarEmprestimo()">💾 Salvar Empréstimo</button>
                </div>
            </div>
        </div>

        <h2>👥 Empréstimos Ativos</h2>
        <hr style="border-color: #334155; margin-bottom: 20px;">

        <div class="cards-grid" id="listaEmprestimos"></div>
    </div>

    <div id="alerta" class="alert-box"></div>

    <script>
        const MEU_PIX = {
            chave: "9198544-6070",
            banco: "PagSeguro",
            nome: "Diego Dias",
            cidade: "Santa Barbara do Pará"
        };

        let emprestimos = JSON.parse(localStorage.getItem('emprestimos')) || [];
        let historicoFinalizados = JSON.parse(localStorage.getItem('historico_finalizados')) || [];

        function atualizarRelogio() {
            const agora = new Date();
            document.getElementById('relogio').innerText = agora.toLocaleTimeString('pt-BR');
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        function adicionarEmprestimo() {
            const nome = document.getElementById('nome').value;
            const valor = parseFloat(document.getElementById('valor').value);
            const data = document.getElementById('dataVencimento').value;
            const hora = document.getElementById('horaVencimento').value;

            if(!nome || !valor || !data || !hora) {
                alert("⚠️ Por favor, preencha todos os campos!");
                return;
            }

            const novoEmprestimo = {
                id: Date.now(),
                nome,
                valorInicial: valor,
                valorTotal: valor * 1.30,
                vencimento: `${data}T${hora}`
            };

            emprestimos.push(novoEmprestimo);
            salvarDados();
            renderizar();
            
            document.getElementById('nome').value = '';
            document.getElementById('valor').value = '';
            document.getElementById('dataVencimento').value = '';
            mostrarMensagem("🚀 Empréstimo salvo com sucesso!");
        }

        function salvarDados() {
            localStorage.setItem('emprestimos', JSON.stringify(emprestimos));
            localStorage.setItem('historico_finalizados', JSON.stringify(historicoFinalizados));
        }

        function mostrarMensagem(texto, cor = '#6366f1') {
            const alerta = document.getElementById('alerta');
            alerta.style.backgroundColor = cor;
            alerta.innerText = texto;
            alerta.style.display = 'block';
            setTimeout(() => { alerta.style.display = 'none'; }, 4000);
        }

        function forçarAtualizacao() {
            renderizar();
            mostrarMensagem("🔄 Painel sincronizado!", "#38bdf8");
        }

        function gerarTextoLembrete(nome, total) {
            return `Olá ${nome} 😊! Lembrando que o vencimento do seu empréstimo está próximo.\n\n💰 Total (30% juros): R$ ${total.toFixed(2)}\n\nPagamento via PIX:\n🔑 Chave: ${MEU_PIX.chave}\n🏦 Banco: ${MEU_PIX.banco}\n👤 Nome: ${MEU_PIX.nome}\n📍 Local: ${MEU_PIX.cidade}`;
        }

        function compartilharWhatsApp(nome, total) {
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(gerarTextoLembrete(nome, total))}`, '_blank');
        }

        function copiarLembrete(nome, total) {
            navigator.clipboard.writeText(gerarTextoLembrete(nome, total)).then(() => {
                mostrarMensagem("📋 Dados de pagamento copiados!", "var(--primary)");
            });
        }

        function finalizarEmprestimo(id, nome) {
            const item = emprestimos.find(emp => emp.id === id);
            if (item) {
                historicoFinalizados.push({
                    nome: item.nome,
                    valorInicial: item.valorInicial,
                    valorTotal: item.valorTotal,
                    dataFinalizacao: new Date().toLocaleString('pt-BR')
                });
            }
            emprestimos = emprestimos.filter(emp => emp.id !== id);
            salvarDados();
            renderizar();
            alert(`🎉 Empréstimo de ${nome} finalizado! Ele foi movido para a página de histórico.`);
        }

        function calcularTempo(dataVencimento) {
            const diferenca = new Date(dataVencimento).getTime() - new Date().getTime();
            if (diferenca <= 0) return { texto: "⚠️ VENCIDO!", classe: "vencido" };
            const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferenca % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferenca % (1000 * 60 * 60)) / (1000 * 60));
            return { texto: `⏱️ Faltam: ${dias}d ${horas}h ${minutos}m`, classe: "" };
        }

        function renderizar() {
            const lista = document.getElementById('listaEmprestimos');
            lista.innerHTML = '';
            if(emprestimos.length === 0) {
                lista.innerHTML = `<p style="color: #64748b;">Nenhum empréstimo ativo no momento. 🌱</p>`;
                return;
            }
            emprestimos.forEach(emp => {
                const tempo = calcularTempo(emp.vencimento);
                const card = document.createElement('div');
                card.className = `card ${tempo.classe}`;
                card.innerHTML = `
                    <div class="card-header">
                        <h3>👤 ${emp.nome}</h3>
                        <span class="cronometro">${tempo.texto}</span>
                    </div>
                    <p><strong>💵 Valor Inicial:</strong> R$ ${emp.valorInicial.toFixed(2)}</p>
                    <p><strong>💰 Total (30%):</strong> <span style="color: #f43f5e; font-weight:bold;">R$ ${emp.valorTotal.toFixed(2)}</span></p>
                    <p><strong>📅 Limite:</strong> ${new Date(emp.vencimento).toLocaleString('pt-BR')}</p>
                    <div class="pix-box">
                        <strong>🏦 Pagar para Diego Dias (PagSeguro)</strong><br>
                        🔑 Celular: <span class="pix-destaque">${MEU_PIX.chave}</span><br>
                        💲 Valor: <span class="pix-destaque">R$ ${emp.valorTotal.toFixed(2)}</span>
                    </div>
                    <div class="actions">
                        <div class="action-row">
                            <button class="btn btn-warning" onclick="compartilharWhatsApp('${emp.nome}', ${emp.valorTotal})">🟢 WhatsApp</button>
                            <button class="btn" style="background:#475569" onclick="copiarLembrete('${emp.nome}', ${emp.valorTotal})">📋 Copiar</button>
                        </div>
                        <button class="btn btn-success" onclick="finalizarEmprestimo(${emp.id}, '${emp.nome}')">✅ Dar Baixa e Arquivar</button>
                    </div>
                `;
                lista.appendChild(card);
            });
        }
        setInterval(renderizar, 30000);
        renderizar();
    </script>
</body>
</html>
