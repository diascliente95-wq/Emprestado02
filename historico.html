<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Empréstimos Finalizados 📜</title>
    <style>
        :root {
            --dark: #1e293b;
            --light: #f8fafc;
            --accent: #6366f1;
            --danger: #ef4444;
            --primary: #25d366;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: var(--light);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-danger { background: var(--danger); }

        .historico-container {
            background: var(--dark);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .tabela-historico {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 15px;
        }

        .tabela-historico th, .tabela-historico td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        .tabela-historico th {
            background: #020617;
            color: #94a3b8;
        }

        .tabela-historico tr:hover {
            background: #334155;
        }

        .status-pago {
            color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>📜 Histórico de Empréstimos Finalizados</h1>
                <p style="color: #94a3b8; margin: 5px 0 0 0;">Relatório e arquivo de contas pagas</p>
            </div>
            <!-- Atalho de volta para a principal -->
            <a href="index.html" class="btn">⬅️ Voltar ao Painel Ativo</a>
        </header>

        <div class="historico-container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>✅ Clientes que já quitaram</h2>
                <button class="btn btn-danger" onclick="limparHistorico()">🗑️ Limpar Todo Histórico</button>
            </div>

            <table class="tabela-historico">
                <thead>
                    <tr>
                        <th>Cliente 👤</th>
                        <th>Valor Inicial Cedido 💵</th>
                        <th>Valor Recebido c/ Juros 💰</th>
                        <th>Data de Pagamento/Baixa 📅</th>
                        <th>Status 📝</th>
                    </tr>
                </thead>
                <tbody id="listaFinalizados">
                    <!-- Gerado automaticamente via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let historicoFinalizados = JSON.parse(localStorage.getItem('historico_finalizados')) || [];

        function renderizarHistorico() {
            const tabela = document.getElementById('listaFinalizados');
            tabela.innerHTML = '';

            if(historicoFinalizados.length === 0) {
                tabela.innerHTML = `<tr><td colspan="5" style="color: #64748b; text-align: center; padding: 30px;">Nenhum registro de pagamento nesta página.</td></tr>`;
                return;
            }

            historicoFinalizados.forEach(item => {
                const linha = document.createElement('tr');
                linha.innerHTML = `
                    <td><strong>${item.nome}</strong></td>
                    <td>R$ ${parseFloat(item.valorInicial).toFixed(2)}</td>
                    <td style="color: var(--primary); font-weight: bold;">R$ ${parseFloat(item.valorTotal).toFixed(2)}</td>
                    <td>📆 ${item.dataFinalizacao}</td>
                    <td class="status-pago">💰 RECEBIDO</td>
                `;
                tabela.appendChild(linha);
            });
        }

        function limparHistorico() {
            if(confirm("⚠️ Deseja apagar permanentemente todos os registros do histórico? Esta ação não pode ser desfeita!")) {
                historicoFinalizados = [];
                localStorage.setItem('historico_finalizados', JSON.stringify(historicoFinalizados));
                renderizarHistorico();
            }
        }

        // Executa a listagem assim que abre a página
        renderizarHistorico();
    </script>
</body>
</html>
